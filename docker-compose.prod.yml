services:
  migrate:
    image: ${APP_IMAGE:-flash-cards-api}:${APP_VERSION:?APP_VERSION must be an immutable release identifier}
    build:
      context: .
      target: production
    command:
      - node
      - ./node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/database/data-source.js
    environment: &app-environment
      NODE_ENV: production
      PORT: ${PORT:-3000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_LOGGING: ${DB_LOGGING:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      ENABLE_PGAUDIT: ${ENABLE_PGAUDIT:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:?JWT_ACCESS_TOKEN_SECRET is required}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-15m}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET:?JWT_REFRESH_TOKEN_SECRET is required}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-7d}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SWAGGER_USERNAME: ${SWAGGER_USERNAME:-}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
      ENABLE_S3: ${ENABLE_S3:-false}
      ENABLE_FLASH_CARDS: ${ENABLE_FLASH_CARDS:-false}
      ENABLE_COLLECTIONS: ${ENABLE_COLLECTIONS:-false}
      ENABLE_TOPICS: ${ENABLE_TOPICS:-false}
      ENABLE_CHECKIN: ${ENABLE_CHECKIN:-false}
      ENABLE_COMMENTS: ${ENABLE_COMMENTS:-false}
      ENABLE_FLASH_CARD_STATES: ${ENABLE_FLASH_CARD_STATES:-false}
      ENABLE_STUDENT_CARD_UPLOADS: ${ENABLE_STUDENT_CARD_UPLOADS:-false}
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
      ENABLE_TWO_FACTOR: ${ENABLE_TWO_FACTOR:-false}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      ENABLE_ACCOUNT_EMAIL_FLOWS: ${ENABLE_ACCOUNT_EMAIL_FLOWS:-false}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Application}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      ENABLE_GOOGLE_OAUTH: ${ENABLE_GOOGLE_OAUTH:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      ALLOWED_FILE_TYPES: ${ALLOWED_FILE_TYPES:-image/jpeg,image/png,image/gif,application/pdf}
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: 'no'

  api:
    image: ${APP_IMAGE:-flash-cards-api}:${APP_VERSION:?APP_VERSION must be an immutable release identifier}
    build:
      context: .
      target: production
    environment: *app-environment
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres_db:
    image: ${POSTGRES_IMAGE:-nestjs-base-postgres}:${POSTGRES_VERSION:-15-pgaudit}
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=write,ddl,role
      - -c
      - pgaudit.log_parameter=off
      - -c
      - pgaudit.log_relation=on
      - -c
      - log_line_prefix=%m [%p] user=%u,db=%d,app=%a,client=%h
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ['sh', '/usr/local/bin/redis-entrypoint.sh']
    volumes:
      - ./docker/redis/entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
      - redis-data:/data
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
